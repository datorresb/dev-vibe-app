[project]
name = "chatbot-poc"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "langgraph",
    "langchain-openai",
    "chainlit",
    "azure-identity",
    "httpx",
    "pandas",
    "matplotlib",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.pytest.ini_options]
markers = [
    "integration: integration tests that may require Azure OpenAI credentials",
]
asyncio_mode = "auto"
