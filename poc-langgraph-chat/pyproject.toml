[project]
name = "poc-langgraph-chat"
version = "0.1.0"
description = "POC: Chatbot conversacional con LangGraph + Chainlit + Azure OpenAI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "chainlit>=1.3.0",
    "azure-identity>=1.19.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"
